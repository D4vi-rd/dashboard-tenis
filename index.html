<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard Tenis</title>

    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..8j00&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <main>
            <section class="tenis">
                <img class="te" src="img/icons/logo.svg" alt="logo tennis">
                <nav>
                    <div class="flex">
                        <img src="img/icons/All Games.svg" alt="icons de all games">
                        <p>All games</p>
                    </div>
                    <div class="flex">
                        <img src="img/icons/Live Score.svg" alt="icons de live">
                        <p>Live games</p>
                        <img src="img/icons/live-on.svg" alt="">
                    </div>
                    <div class="flex">
                        <img src="img/icons/Scores.svg" alt="icons de score">
                        <p>Score</p>
                    </div>
                    <div class="flex">
                        <img src="img/icons/Categories.svg" alt="icons de categorias">
                        <p>Categories</p>
                    </div>
                    <div class="flex">
                        <img src="img/icons/Video.svg" alt="icons de video">
                        <p>Vídeo</p>
                    </div>
                    <div class="flex">
                        <img src="img/icons/Statistic.svg" alt="icons de statistic">
                        <p>Statistic</p>
                    </div>
                </nav>

                <div class="card-tenis">
                    <img class="cadeado" src="img/icons/Feature.svg" alt="icon de cadeado">
                    <p>
                        Upgarde to <span>PRO </span>for 
                        more features.
                    </p>

                    <button>
                        Upgrade
                    </button>
                </div>
            </section>

            <section class="live">

                <div class="live-bar">
                    <div class="score">
                        <img src="img/icons/Arrow Left.svg" alt="seta para esquerda">
                        <h2>Live Score</h2>
                    </div>

                    <div class="bar">
                        <img src="img/icons/Search.svg" alt="icon lupa">
                        <img src="img/icons/Settings.svg" alt="icon configuração">
                        <img src="img/icons/Notification.svg" alt="icon notificação">
                        <img src="img/icons/perfil.svg" alt="foto de perfil">
                    </div>
                </div>

                <div class="div">
                    <div class="next">

                        <div class="match">

                            <div class="next-flex">
                                <h3>Your next match</h3>
                                <div class="cale">
                                    <p> 18 Junary 2020</p>
                                    <img src="img/icons/Calendar.svg" alt="">
                                </div>
                            </div>

                            <div class="perso">
                                <div class="d1">
                                    <h2>Naomi O.</h2>
                                    <img src="img/icons/People 1.svg" alt="mulher">
                                </div>

                                <p>:</p>

                                <div class="d1">
                                    <h2>Anindita R..</h2>
                                    <img src="img/icons/People 2.svg" alt="mulher">
                                </div>
                            </div>

                        </div>

                        <h2>Statistic</h2>

                        <div class="duo-card">
                            
                        </div>


                    </div>
                    <div class="anin"></div>
                </div>

            </section>
        </main>
    </div>
    
</body>
</html>
